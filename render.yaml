databases:
  - name: gridwatch-db
    plan: free
    databaseName: gridwatch

services:
  - type: web
    name: gridwatch
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gridwatch-db
          property: connectionString
